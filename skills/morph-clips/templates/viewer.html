<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ · motion clips</title>
<style>
:root{--bg:#0f1214;--card:#1b2227;--ink:#eef2f4;--muted:#8a97a0;--accent:#ffc83d;--line:#ffffff1f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,'Segoe UI',system-ui,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:var(--muted)}
main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 70px)}
nav{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 70px)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #ffffff0d;color:inherit;font:inherit;padding:12px 16px;cursor:pointer}
nav button:hover{background:#ffffff08}nav button.on{background:var(--card);box-shadow:inset 3px 0 var(--accent)}
nav b{color:var(--accent);margin-right:8px}nav small{display:block;color:var(--muted);margin-top:2px}
section{padding:18px 22px}video{width:100%;max-height:68vh;background:#000;border-radius:10px}
#info h2{margin:14px 0 4px;font-size:18px}#info .tc{color:var(--muted)}#info q{display:block;margin-top:8px;color:#cfd9d7}
#info code{color:var(--accent)}.hint{color:var(--muted);margin-top:12px;font-size:13px}
@media (max-width:760px){main{grid-template-columns:1fr}nav{max-height:none;border-right:0}}
</style></head><body>
<header><h1>/*TITLE*/</h1><p>Step through the clips. ← → to move, space to play.</p></header>
<main><nav id="list"></nav><section><video id="v" controls playsinline></video><div id="info"></div>
<p class="hint">The preview is for review. In your final cut, place each clip at the in-point in its file name.</p></section></main>
<script>
const K=/*CLIPS*/[];
const list=document.getElementById('list'),v=document.getElementById('v'),info=document.getElementById('info');let i=0;
// Build with textContent only: titles and transcript lines are data, never markup.
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;};
K.forEach((k,n)=>{const b=document.createElement('button');b.append(el('b',k.n),k.t,el('small',k.tc+(k.y?' · '+k.y:'')));b.onclick=()=>pick(n);list.appendChild(b);});
function pick(n){i=(n+K.length)%K.length;const k=K[i];[...list.children].forEach((b,j)=>b.classList.toggle('on',j===i));
 v.src=k.src;v.play().catch(()=>{});const tc=el('div',k.tc+' · ','tc');tc.append(el('code',k.f));info.replaceChildren(el('h2',k.t),tc,...(k.q?[el('q',k.q)]:[]));}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')pick(i+1);if(e.key==='ArrowLeft')pick(i-1);if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause();}});
pick(0);
</script></body></html>

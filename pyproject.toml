[project]
name = "tubecrew"
version = "0.1.0"
description = "A YouTube production crew for coding agents: skills, gate scripts and independent reviewers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.optional-dependencies]
youtube = ["google-auth>=2.20", "google-auth-oauthlib>=1.0", "requests>=2.28"]
voice = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
